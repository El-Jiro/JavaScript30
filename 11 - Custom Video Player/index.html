<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Video Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <div class="player">
        <video class="player__video viewer" src="652333414.mp4"></video>

        <div class="player__controls">
            <div class="progress">
                <div class="progress__filled" title="00:00"></div>
            </div>
            <button class="player__button toggle" title="Pausar/Reanudar reproducción">►</button>
            <input type="range" id="volume" class="player__slider" min="0" max="1" step="0.01" value="0.5">
            <input type="range" id="playbackRate" class="player__slider" min="0.25" max="2" step="0.25" value="1">
            <button data-skip="-10" class="player__button" title="Retroceder 10 segundos">« 10s</button>
            <button data-skip="25" class="player__button" title="Adelantar 25 segundos">25s »</button>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
