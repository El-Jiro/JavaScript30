<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Update CSS variables with JS</title>
    <link rel="shortcut icon" href="https://fav.farm/🔥">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h2>Actualiza las variables CSS con <span class='hl'>JS</span></h2>

    <div class="controls">
        <label for="spacing">Espaciado:</label>
        <input id="spacing" type="range" name="spacing" min="10" max="200" value="10" data-sizing="px">

        <label for="blur">Desenfocado:</label>
        <input id="blur" type="range" name="blur" min="0" max="25" value="10" data-sizing="px">

        <label for="base">Color Base</label>
        <input id="base" type="color" name="base" value="#ffc600">
    </div>

    <img src="ciudad.jpeg">
</body>

</html>
