<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Update CSS variables with JS</title>
    <link rel="shortcut icon" href="https://fav.farm/🔥">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h2>Actualiza las variables <span class="hl">CSS</span> con <span class='hl'>JS</span></h2>

    <div class="controls">
        <label for="spacing">Espaciado:</label>
        <input id="spacing" type="range" min="10" max="200" value="10" data-sizing="px">

        <label for="blur">Desenfocado:</label>
        <input id="blur" type="range" min="0" max="25" value="10" data-sizing="px">

        <label for="base">Color Base</label>
        <input id="base" type="color" name="base" value="#ffc600">
    </div>

    <img src="ciudad.jpeg">

    <script>
        //Obtenemos una lista de los inputs mediante document.querySelector y los guardamos en la variable inputs
        const inputs = document.querySelectorAll(".controls>input")
        console.log(inputs) //imprimimos controls por consola para asegurarnos de que funciona correctamente

        //Creamos la función handleUpdate que imprimirá el valor del objeto actual por consola
        function handleUpdate() {

            /**Esto nos permitirá saber si un elemento HTML tiene el atributo data-sizing, en cuyo caso
             * le asignaremos a la variable suffix el valor de dicho atributo, de lo contrario su valor
             * será una cadena vacía*/
            const suffix = this.dataset.sizing || ""
            /**Seleccionamos nuestro elemento raíz con document.documentElement y posteriormente
             * accedemos a su style y sobre este invocamos el método setProperty, lo que nos permitirá acceder 
             * a las variables del css y modificar su valor
            */

            document.documentElement.style.setProperty(`--${this.id}`, `${this.value}${suffix}`)
        }

        /**Llamamos a forEach sobre nuestro objeto controls y le pasamos la función addEventListener,
         * el tipo de evento será change y el callback será la función handleUpdate
        */
        inputs.forEach(input => input.addEventListener("change", handleUpdate))

    </script>

</body>

</html>
