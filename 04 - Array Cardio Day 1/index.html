    <script>
        // Ponte tus shorts ¡Esto es un entrenamiento de arrays!
        // ## Array Cardio Day 1

        // Algunos datos con los que podemos trabajar

        const inventors = [
            { first: 'Albert', last: 'Einstein', year: 1879, passed: 1955 },
            { first: 'Isaac', last: 'Newton', year: 1643, passed: 1727 },
            { first: 'Galileo', last: 'Galilei', year: 1564, passed: 1642 },
            { first: 'Marie', last: 'Curie', year: 1867, passed: 1934 },
            { first: 'Johannes', last: 'Kepler', year: 1571, passed: 1630 },
            { first: 'Nicolaus', last: 'Copernicus', year: 1473, passed: 1543 },
            { first: 'Max', last: 'Planck', year: 1858, passed: 1947 },
            { first: 'Katherine', last: 'Blodgett', year: 1898, passed: 1979 },
            { first: 'Ada', last: 'Lovelace', year: 1815, passed: 1852 },
            { first: 'Sarah E.', last: 'Goode', year: 1855, passed: 1905 },
            { first: 'Lise', last: 'Meitner', year: 1878, passed: 1968 },
            { first: 'Hanna', last: 'Hammarström', year: 1829, passed: 1909 }
        ];

        const people = [
            'Bernhard, Sandra', 'Bethea, Erin', 'Becker, Carl', 'Bentsen, Lloyd', 'Beckett, Samuel', 'Blake, William', 'Berger, Ric', 'Beddoes, Mick', 'Beethoven, Ludwig',
            'Belloc, Hilaire', 'Begin, Menachem', 'Bellow, Saul', 'Benchley, Robert', 'Blair, Robert', 'Benenson, Peter', 'Benjamin, Walter', 'Berlin, Irving',
            'Benn, Tony', 'Benson, Leana', 'Bent, Silas', 'Berle, Milton', 'Berry, Halle', 'Biko, Steve', 'Beck, Glenn', 'Bergman, Ingmar', 'Black, Elk', 'Berio, Luciano',
            'Berne, Eric', 'Berra, Yogi', 'Berry, Wendell', 'Bevan, Aneurin', 'Ben-Gurion, David', 'Bevel, Ken', 'Biden, Joseph', 'Bennington, Chester', 'Bierce, Ambrose',
            'Billings, Josh', 'Birrell, Augustine', 'Blair, Tony', 'Beecher, Henry', 'Biondo, Frank'
        ];

        // Array.prototype.filter()
        // 1. Filtra la lista de inventores por los que nacieron en los 1500
        const filteredInventors = inventors.filter((i) => i.year >= 1500 && i.year < 1600)
        console.table(filteredInventors)

        // Array.prototype.map()
        // 2. Danos un array de los nombres y apellidos de los inventores
        const mappedInventors = inventors.map((i) => `${i.first} ${i.last}`)
        console.log(mappedInventors)

        // Array.prototype.sort()
        // 3. Ordena los inventores por fecha de nacimiento, del más viejo al más joven
        const sortedInventors = inventors.sort((a, b) => a.year - b.year)
        console.table(sortedInventors)

        // Array.prototype.reduce()
        // 4. Cuántos años en total vivieron los inventores contándolos a todos

        inventors.forEach((i) => {
            const edad = i.passed - i.year
            i.age = edad
        })

        //console.log(inventors)

        const initialValue = 0
        const reducedInventors = inventors.reduce((accumulator, currentValue) => accumulator + currentValue.age, initialValue)

        console.table(reducedInventors)

        // 5. Ordena los inventores por el número de años vividos

        const sortedInventors2 = inventors.sort((a, b) => a.age - b.age)
        console.table(sortedInventors2)

        // 6. Crea una lista de los Boulevards en Paris que contengan "de" en cualquier parte del nombre
        // https://en.wikipedia.org/wiki/Category:Boulevards_in_Paris

        const filteredBoulevards = boulevardsList.filter((b) => b.includes("de"))
        console.log(filteredBoulevards)

        // 7. Ejercicio de Ordenamiento
        // Organiza las personas por su apellido en orden alfabético 
        const sortedPeople = people.sort()
        console.log(sortedPeople)
        // 8. Ejercicio de reducción
        // Suma las instancias de cada uno: 
        const data = ['car', 'car', 'truck', 'truck', 'bike', 'walk', 'car', 'van', 'bike', 'walk', 'car', 'van', 'car', 'truck', "motorbike"];

        const transportation = data.reduce((obj, item) => {

            !obj[item] ? obj[item] = 0 : null
            obj[item]++
            console.log(item)
            return obj
        }, {})

        console.log(transportation)
    </script>
