<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Click and Drag</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>
    <div class="items">
        <div class="item item1">01</div>
        <div class="item item2">02</div>
        <div class="item item3">03</div>
        <div class="item item4">04</div>
        <div class="item item5">05</div>
        <div class="item item6">06</div>
        <div class="item item7">07</div>
        <div class="item item8">08</div>
        <div class="item item9">09</div>
        <div class="item item10">10</div>
        <div class="item item11">11</div>
        <div class="item item12">12</div>
        <div class="item item13">13</div>
        <div class="item item14">14</div>
        <div class="item item15">15</div>
        <div class="item item16">16</div>
        <div class="item item17">17</div>
        <div class="item item18">18</div>
        <div class="item item19">19</div>
        <div class="item item20">20</div>
        <div class="item item21">21</div>
        <div class="item item22">22</div>
        <div class="item item23">23</div>
        <div class="item item24">24</div>
        <div class="item item25">25</div>
    </div>

    <script>
        //Primeramente agarramos el div.items, es decir el marco blanco que contiene todos los demás elementos
        const slider = document.querySelector("div.items")
        console.log(slider)

        /**Creamos una variable booleana que nos indique si el botón izquierdo del mouse 
         * está siendo presionado, por defecto su valor será falso:*/
        let isMouseDown = false

        /**Creamos otras dos variables, una que nos indique el punto de inicio donde
         * hicimos clic y otra que nos indique la distancia que hemos arrastrado el ratón 
         * en píxeles desde el punto inicial. Estas no tendrán un valor inicial, ya el valor 
         * se les asignará dinámicamente durante el transcurso de los eventos.
        */
        let startX
        let scrollLeft

        /**Añadimos cuatro EventListener de tipo mouseenter, mouseup, mouseleave y mousedown,
           * los añadiremos al slider aprovechando la propagación para no tener que hacer un forEach
           * y añadir el listener a cada uno de los rectángulos
          */


        //Pasamos como parámetro del callback un objeto Event (e)
        slider.addEventListener("mousedown", (e) => {

            //Cuando se presione el botón del mouse, cambiamos isMouseDown a true
            isMouseDown = true

            //También añadimos la clase active al slider: 
            slider.classList.add("active")

            /**Calcularemos el valor de startX, es decir el punto donde se cliqueó inicialmente, restando  el valor 
             * de la propiedad offsetLeft de slider (que representa la distancia entre el borde izquierdo del div
             * y el borde de la ventana) al valor de la propiedad pageX de evento, que representa el punto absoluto 
             * en el eje x de la venta donde hicimos clic*/
            console.log(e)
            startX = e.pageX - slider.offsetLeft
            console.log(startX)

            /**Asignamos el scrollLeft de slider, que representa la actual posición horizontal del contenido de un 
             * elemento respecto al borde izquierdo del mismo*/
            scrollLeft = slider.scrollLeft
        })

        slider.addEventListener("mouseleave", () => {

            //Cambiaremos a false si el cursor se mueve fuera del elemento objetivo, es decir el slider
            isMouseDown = false
            //Eliminamos la clase active:
            slider.classList.remove("active")

        })

        slider.addEventListener("mouseup", () => {
            //También será falso cuando se suelte el botón obviamente
            isMouseDown = false

            //Eliminamos la clase active:
            slider.classList.remove("active")
        })

        slider.addEventListener("mousemove", () => {
            //Imprimimos el valor de isMouseDown y mensaje que diga "¡Funciona!"
            //Añadimos un if para que sólo se ejecute si isMouseDown es true:
            if (isMouseDown == true) {
                /**Calculamos la distancia de desplazamiento en el eje x de la misma manera 
                 * en que calculamos el punto de origen, pero en esta ocasión el valor cambiará
                 * dinámicamente conforme nos movamos ya que lo estamos haciendo con la información
                 * de un evento mousemove. Guardamos el resultado en la variable x
                */
                const x = e.pageX - slider.offsetLeft
                //Imprimimos en consola un objeto con las propiedades x y startx:
                console.log({ startX, x })
            }
        })

    </script>
</body>

</html>
