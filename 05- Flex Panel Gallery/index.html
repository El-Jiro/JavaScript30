<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Panels 💪</title>
    <link rel="shortcut icon" href="https://fav.farm/🔥" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="panels">
        <div class="panel panel1">
            <p>Hey</p>
            <p>Let's</p>
            <p>Dance</p>
        </div>
        <div class="panel panel2">
            <p>Give</p>
            <p>Take</p>
            <p>Receive</p>
        </div>
        <div class="panel panel3">
            <p>Experience</p>
            <p>It</p>
            <p>Today</p>
        </div>
        <div class="panel panel4">
            <p>Give</p>
            <p>All</p>
            <p>You can</p>
        </div>
        <div class="panel panel5">
            <p>Life</p>
            <p>In</p>
            <p>Motion</p>
        </div>
    </div>

    <script>

        //Obtenemos una lista de todos los paneles con document.querySelectorAll()
        const panels = document.querySelectorAll(".panel")
        console.log(panels)

        //Creamos una función para añadir y remover (toggle) la clase open
        function toggleOpen() {
            this.classList.toggle("open")
        }

        /**Creamos otra función para la clase open-active, pero esta será un poco diferente,
         * en primer lugar recibiremos un objeto e (Event) como parámetro, ya que habrá múltiples eventos
         * de transición tomando lugar al mismo tiempo y necesitaremos saber cual desencadenará esta función
        */

        function toggleActive(e) {
            /**Imprimimos en consola el atributo propertyName del evento, el cual
             * nos da dos resultados simultáneas: flex-grow y font-size, ya que en el css
             * de nuestra clase open indicamos que creciera tanto el flex como el tamaño de fuente
             * */
            console.log(e.propertyName)

            /**En Safari el evento se llama simplemente flex, pero en Chrome y otros navegadores 
             * es flex-grow, cubriremos ambos casos aquí evaluando si el propertyName incluye flex,
             * en cuyo caso haremos el toggle de open-active
            */
            if (e.propertyName.includes("flex")) {
                this.classList.toggle("open-active")
            }

        }

        //Añadimos un evenListener de tipo onclick a cada uno de los paneles con un forEach
        panels.forEach((p) => p.addEventListener("click", toggleOpen))

        //Añadimos un segundo listener de tipo ontransitionend de la misma forma
        panels.forEach((p) => p.addEventListener("transitionend", toggleActive))
    </script>
</body>

</html>
