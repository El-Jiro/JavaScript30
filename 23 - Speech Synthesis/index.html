<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Speech Synthesis</title>
    <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <div class="voiceinator">

        <h1>El Vozinador 5000</h1>

        <select name="voice" id="voices">
            <option value="">Seleccione una voz</option>
        </select>

        <label for="rate">Velocidad:</label>
        <input id="rate" type="range" min="0" max="3" value="1" step="0.1">

        <label for="pitch">Tono:</label>

        <input id="pitch" type="range" min="0" max="2" step="0.1">
        <textarea id="text">¡Hola! Adoro JavaScript 👍</textarea>

        <button id="speak">Hablar</button>
        <button id="stop">Detener</button>

    </div>

    <script>
        const msg = new SpeechSynthesisUtterance();
        const voices = [];
        const voicesDropdown = document.querySelector('[name="voice"]');
        const options = document.querySelectorAll('[type="range"], #text');
        const speakButton = document.querySelector('#speak');
        const stopButton = document.querySelector('#stop');
        //El mensaje que aparezca al cargar la página será siempre "Hello! I love JavaScript 👍"
        msg.text = document.querySelector('#text').value

        //Creamos la función populateVoices para llenar el array voices
        function populateVoices() {

            /**Añadimos al array cada una de las voces del objeto speechSynthesis mediante el método getVoices, 
             * recordando añadir el operador spread de lo contrario obtendremos un array de objetos JSON dentro
             * de nuestro propio array en vez de sólo un array de objetos JSON
            */
            voices.push(...this.getVoices())
            console.log(voices)

            /**Mapeamos el array voices para crear las opciones de la lista desplegable
             * recordando añadir un join al final para que nos devuelva el resultado en 
             * forma de string y lo guardamos en voiceOptions. Pero antes le aplicaremos un 
             * filtro para que sólo incluya las voces en español e inglés*/

            const voiceOptions = voices.filter((voice) => voice.lang.includes("en") || voice.lang.includes("es"))
                .map((voice) => {

                    /**Creamos una etiqueta html option, en su atributo value ponemos el nombre de la voz 
                     * y en el texto dentro de las etiquetas de apetura y cierre ponemos el nombre junto 
                     * con el idioma entre paréntesis, recordando usar el retorno explícito con return*/

                    return `<option value="${voice.name}">${voice.name} (${voice.lang})</option>`

                }).join("")

            console.log(voiceOptions)

            //Ahora lo asignamos al atributo innerHTML de voicesDropdown:
            voicesDropdown.innerHTML = voiceOptions
        }

        /**Creamos una nueva función llamada setVoice, la cual se encargará de aplicar la 
         * voz seleccionada a nuestro mensaje*/

        function setVoice() {

            /**Buscamos en el array de voces el objeto cuyo atributo name coincida con el atributo.value 
             * de la opción seleccionada y lo asignamos al atributo voice de nuestro mensaje*/
            msg.voice = voices.find((voice) => voice.name === this.value)

            //Llamamos a toggleVoice
            toggleVoice()
        }

        /**Creamos una tercera función llamada toggleVoice, la cual se encargará de reiniciar la lectura 
         * del mensaje si seleccionamos una nueva voz antes de que esta haya finalizado. Añadimos un parámetro opcional
         * llamado startOver, el cual definirá si el mensaje se reinicia automáticamente después de detenerse. Por default
         * el parámetro tendrá el valor de true*/
        function toggleVoice(startOver = true) {
            //Llamamos al método cancel e inmedidatemente después al método speak, recordando pasarle msg como parámetro
            speechSynthesis.cancel()
            startOver ? speechSynthesis.speak(msg) : null
        }

        /**Creamos la función setOptions que se encargará de ajustar el valor de 
         * la propiedad de msg cuyo nombre coincida con el id del controlador*/
        function setOptions() {
            console.log(`${this.id}: ${this.value}`) //Imprimimos el id del controlador y su respectivo valor
            msg[this.id] = this.value //Le asignamos el valor del controlador a la propiedad correspondiente de msg
            toggleVoice() //Llamamos a toggleVoice para reiniciar cada vez que se aplique un cambio
        }

        /**Añadimos un EventListener de tipo voiceschanged a la variable global speechSynthesis, la cual 
         * representa el propio servicio de habla y provee distintos métodos y propiedades para controlar las
         * operaciones de texto a voz. Cada vez que el navegador carga, llena la lista de voces disponibles dependiendo
         * de las capacidades del sistema y los datos de voz instalados, esto desata el evento voiceschanged. También
         * puede ser activado si el usuario instala nuevas voces o si el navegador actualiza su lista interna de voces 
         * por cualquier otra razón*/
        speechSynthesis.addEventListener("voiceschanged", populateVoices)

        /**Creamos otro EventListener, esta vez de tipo change, y lo acoplamos a nuestra lista desplegable,
         * de esta manera cada vez que se seleccione una nueva voz llamará a nuestra función setVoice
        */
        voicesDropdown.addEventListener("change", setVoice)

        /**Hacemos un forEach sobre la lista de opciones de configuración del mensaje 
         * y le añadimos a cada uno un eventListener de tipo chssnge que llame a setOptions*/
        options.forEach((option) => option.addEventListener("change", setOptions))

        /**Añadimos un EventListener de tipo click a cada uno de los botones, dentro del cual invocaremos 
         * a toggleVoice, sin parámetros en el botón de hablar y con el parámetro startOVer en false para 
         * el botón de parar*/

        speakButton.addEventListener("click", toggleVoice)
        stopButton.addEventListener("click", () => toggleVoice(false))
    </script>

</body>

</html>
