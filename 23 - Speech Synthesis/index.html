<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Speech Synthesis</title>
    <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <div class="voiceinator">

        <h1>El Vozinador 5000</h1>

        <select name="voice" id="voices">
            <option value="">Seleccione una voz</option>
        </select>

        <label for="rate">Velocidad:</label>
        <input id="rate" type="range" min="0" max="3" value="1" step="0.1">

        <label for="pitch">Tono:</label>

        <input id="pitch" type="range" min="0" max="2" step="0.1">
        <textarea name="text">¡Hola! Adoro JavaScript 👍</textarea>
        <button id="stop">Detener</button>
        <button id="speak">Hablar</button>

    </div>

    <script>
        const msg = new SpeechSynthesisUtterance();
        const voices = [];
        const voicesDropdown = document.querySelector('[name="voice"]');
        const options = document.querySelectorAll('[type="range"], [name="text"]');
        const speakButton = document.querySelector('#speak');
        const stopButton = document.querySelector('#stop');
        //El mensaje que aparezca al cargar la página será siempre "Hello! I love JavaScript 👍"
        msg.text = document.querySelector('[name="text"]').value

        //Creamos la función populateVoices para llenar el array voices
        function populateVoices() {

            /**Añadimos al array cada una de las voces del objeto speechSynthesis mediante el método getVoices, 
             * recordando añadir el operador spread ..., de lo contrario obtendremos un array de objetos JSON dentro
             * de nuestro propio array
            */
            voices.push(...this.getVoices())
            console.log(voices)

        }

        /**Añadimos un EventListener de tipo voiceschanged a la variable global speechSynthesis, la cual 
         * representa el propio servicio de habla y provee distintos métodos y propiedades para controlar las
         * operaciones de texto a voz. Cada vez que el navegador carga, llena la lista de voces disponibles dependiendo
         * de las capacidades del sistema y los datos de voz instalados, esto desata el evemtp voiceschanged. También
         * puede ser activado si el usuario instala nuevas voces o si el navegador actualiza su lista interna de voces 
         * por cualquier razón*/
        speechSynthesis.addEventListener("voiceschanged", populateVoices)

    </script>

</body>

</html>
