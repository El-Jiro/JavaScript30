<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>JS Reference VS Copy</title>
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <script>
        // Empecemos con strings, números y booleanos
        let age = 100
        let age2 = age

        //Reasignamos age a 200
        age = 200
        console.log(age, age2)

        let name = "Wes"
        let name2 = name

        //Reasignamos name a Wesley
        name = "Wesley"
        console.log(name, name2)

        let condition = true
        let condition2 = condition

        //Reasignamos condition a false
        condition = false
        console.log(condition, condition2)

        /**Si se crea una variable con un tipo de dato primitivo como number, string o boolean,
         * y después se crea otra que apunta hacia ella, la segunda será una copia, no una referencia
         * es decir, que su valor no cambiará incluso si se cambia el valor de la original y viceversa
        */

        // Digamos que tenemos un array
        const players = ['Wes', 'Sarah', 'Ryan', 'Poppy'];

        // y queremos hacer una copia del mismo.
        const team = players

        // Penserías que simplemente podríamos hacer algo así:
        console.log(players, team)

        // Sin embargo ¿Que pasa cuando actualizamos ese array?
        //team[3] = "Lux"
        // ¡Ahora tenemos aquí un problema!

        // !Oh no, hemos editado el array original también!

        // ¿Por qué? Pues porque esto es una referencia al array, no una copia ¡Ambas apuntan al mismo array!

        // ¿Entonces, como arreglamos esto? ¡Haciendo una copia en su lugar!


        // Una forma de hacerlo
        const team2 = players.slice()

        // O crea un nuevo array y concatena el viejo en su interior
        const team3 = [].concat(players)

        // O utliza el nuevo operador Spread ... de ES6
        const team4 = [...players]

        //Ahora cuando lo actualizamos no se modifica el original
        team4[3] = "Kevin"
        console.log(players, team4)

        //Por último podemos usar Array.from
        const team5 = Array.from(players)
        team5[3] = "Ruben"
        //Lo mismo aplica para los objetos, digamos que tenemos un objeto persona

        //Con objetos
        const person = {
            name: 'Wes Bos',
            age: 80
        };

        //console.log(person)

        // Y pensamos que hicimos una copia:
        const person2 = person
        //person2.number = 99

        // ¿Cómo hacemos una copia en realidad?

        /**Obect.assign toma tres parámetros, un objeto vacío, el objeto del que queremos copiar
         * las propiedades, y opcionalmente un tercer objeto con las nuevas propiedades que queremos que
         * tenga nuestra copia
        */
        const person3 = Object.assign({}, person, { number: 99, age: 12 })
        console.log(person3)

        // Con suerte pronto veremos el objeto ...spread
        //Ignoren el comentario de arriba, ya funciona esta wea
        const person4 = { ...person }
        console.log(person4)

        /**Nota - Esto es sólo de 1 nivel de profundidad - tanto para Objetos como Arrays. 
         * Esto significa que si tenemos objetos o arrays anidados sólo se creará una referencia a
         * estos, más no una copia, lo cual implica que los cambios hechos en este afectarán también
         * al original. Lodash tiene un método cloneDeep, pero deberías pensar dos veces antes de usarlo.*/

        const wes = {
            name: "Wes",
            age: 100,
            social: {
                twitter: "@wesbos",
                facebook: "wesbos.developer"
            }
        }

        console.clear()
        const dev = Object.assign({}, wes)
        console.log(dev)

        //Una alternativa sin usar librerías o dependencias externas es JSON.parse(JSON.stringify(Object))
        const dev2 = JSON.parse(JSON.stringify(wes))
        console.log(dev2)
    </script>

</body>

</html>
