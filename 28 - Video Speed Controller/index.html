<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video Speed Scrubber</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <div class="wrapper">
        <video class="flex" width="765" height="430" src="./🟣 CLASE 22 ARREGLOS DEFINICIÓN, TIPOS y DECLARACIÓN.webm"
            loop controls>
        </video>
        <div class="speed">
            <div class="speed-bar">x1</div>
        </div>
    </div>

    <script>
        //Seleccionamos el div que contiene la barra de velocidad, es decir la parte blanca:
        const speed = document.querySelector("div.speed")
        console.log(speed)

        //Seleccionamos la barra de velocidad, es decir el área de color con la gradiente y el número
        const bar = document.querySelector("div.speed-bar")
        console.log(bar)

        //Seleccionamos el vídeo: 
        const video = document.querySelector("video")
        console.log(video)

        /**Añadimos a speed un EventListener de tipo mousemove, al cual
         * le pasaremos un callback que reciba como parámetro un objeto de tipo Event 
         * e imprima en consola la información del mismo
        */

        speed.addEventListener("mousemove", function (e) {
            //console.log(e)
            /**Necesitamos calcular en que punto relativo al eje Y de la barra nos encontramos, 
             * para esto le restamos la propiedad offsetTop de this (el elemento que está desencadenando
             * nuestro EventListener, es decir la barra de velocidad) a la propiedad pageY del objeto e.
             * Guardamos el resultado en y
            */
            const y = e.pageY - this.offsetTop

            //Ahora necesitaremos calcular el porcentaje de llenado de la barra dividiendo y sobre offsetHeight:
            const percent = y / this.offsetHeight

            //La velocidad mínima será x0.4 y la máxima x4, guardaremos estos valores en constantes
            const min = 0.4
            const max = 4

            //Calculamos la altura a la que se llenará la barra multiplicando el porcentaje x100 y rendondeando
            //Deberemos añadir también el signo de porcentaje al final
            const height = `${Math.round(percent * 100)}%`

            //Ajustamos la auttra visuamente asignando height a la propiedad css homónima de bar:
            bar.style.height = height

            console.log({ y, percent, height })

        })
    </script>
</body>

</html>
