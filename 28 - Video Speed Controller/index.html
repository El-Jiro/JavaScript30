<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Video Speed Scrubber</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <div class="wrapper">
        <video class="flex" width="765" height="430" src="./🟣 CLASE 22 ARREGLOS DEFINICIÓN, TIPOS y DECLARACIÓN.webm"
            loop controls>
        </video>
        <div class="speed">
            <div class="speed-bar">x1</div>
        </div>
    </div>

    <script>
        //Seleccionamos el div que contiene la barra de velocidad, es decir la parte blanca:
        const speed = document.querySelector("div.speed")
        console.log(speed)

        //Seleccionamos la barra de velocidad, es decir el área de color con la gradiente y el número
        const bar = document.querySelector("div.speed-bar")
        console.log(bar)

        //Seleccionamos el vídeo: 
        const video = document.querySelector("video")
        console.log(video)

        /**Añadimos a speed un EventListener de tipo mousemove, al cual
         * le pasaremos un callback que reciba como parámetro un objeto de tipo Event 
         * e imprima en consola la información del mismo
        */
    </script>
</body>

</html>
