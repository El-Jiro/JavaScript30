<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hold shift to check multiple checkboxes</title>
    <link rel="shortcut icon" href="https://fav.farm/🔥" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--
       Lo siguiente es un diseño común que verías un cliente de email.
    
       Cuando un usuario haga clic en uns checkbox, mantenga presionado Shift, y luego haga clic en otra checkbox 
       unas pocas filas debajo, todos las checkboxes intermedias entre esas dos deberían seleccionarse.
    
      -->
    <div class="inbox">
        <div class="item">
            <input type="checkbox">
            <p>This is an inbox layout.</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Check one item</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Hold down your Shift key</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Check a lower item</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Everything in between should also be set to checked</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Try to do it without any libraries</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Just regular JavaScript</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Good Luck!</p>
        </div>
        <div class="item">
            <input type="checkbox">
            <p>Don't forget to tweet your result!</p>
        </div>
    </div>


</body>

</html>
