<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Understanding JavaScript's Capture</title>
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<style>
    html {
        box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
        box-sizing: inherit;
    }

    div {
        width: 100%;
        padding: 100px;
    }

    .one {
        background: thistle;
    }

    .two {
        background: mistyrose;
    }

    .three {
        background: coral;
    }
</style>

<body class="bod">

    <div class="one">
        <div class="two">
            <div class="three">
            </div>
        </div>
    </div>
    <button></button>

    <script>
        //Seleccionamos todos los divs
        const divs = document.querySelectorAll("div")
        console.log(divs)

        //Creamos una función para imprimir el nombre de la clase del elemento sobre el cual sea llamada la función
        function logClass() {
            console.log(this.classList.value)
        }

        /**Hacemos un forEach que le añada un EventListener de tipo clic a cada div. Como los divs están anidados, 
         * al hacer clic en uno el evento también se desencadenará en todos los que estén arriba del mismo, esto 
         * se conoce como "Bubbling".
        */
        //divs.forEach((div) => div.addEventListener("click", logClass))

        //Pasará lo mismo si añadimos el Listener en el cuerpo del documento
        //document.body.addEventListener("click", logClass)

        /**Esto se debe a que la captura y propagación de los eventos por defecto se hace de menor
         * a mayor, es decir se empieza por el elemento que esté más abajo en la anidación y de ahí se propaga
         * a todos sus elementos padres, sin embargo, esto se puede invertir si al invocar la función addEventListener
         * le pasamos como tercer parámetro un objeto JSON con la propiedad capture establecida en true
        */

        divs.forEach((div) => div.addEventListener("click", logClass, { capture: true }))
    </script>
</body>

</html>
