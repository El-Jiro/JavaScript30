<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Understanding JavaScript's Capture</title>
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<style>
    html {
        box-sizing: border-box;
    }

    *,
    *:before,
    *:after {
        box-sizing: inherit;
    }

    div {
        width: 100%;
        padding: 100px;
    }

    .one {
        background: thistle;
    }

    .two {
        background: mistyrose;
    }

    .three {
        background: coral;
    }
</style>

<body class="bod">

    <div class="one">
        <div class="two">
            <div class="three">
            </div>
        </div>
    </div>
    <button></button>

    <script>
        //Seleccionamos todos los divs
        const divs = document.querySelectorAll("div")
        console.log(divs)

        //Creamos una función para imprimir el nombre de la clase del elemento sobre el cual sea llamada la función
        function logClass() {
            console.log(this.classList.value)
        }


        /**Hacemos un forEach que le añada un EventListener de tipo clic 
         *a cada div, el cual se encargará de invocar nuestra función*/
        divs.forEach((div) => div.addEventListener("click", logClass))

    </script>
</body>

</html>
