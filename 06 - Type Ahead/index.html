<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Type Ahead 👀</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <form class="search-form">
        <input type="text" id="search" placeholder="Ciudad o Estado">
        <ul class="suggestions">
            <li>Filtrar por Ciudad</li>
            <li>O por Estado</li>
        </ul>
    </form>
    <script>

        const endpoint = 'https://gist.githubusercontent.com/Miserlou/c5cd8364bf9b2420bb29/raw/2bf258763cdddd704f8ffd3ea9a3e81d25e2c6f6/cities.json';
        const cities = []

        /**Para realizar una petición http simple de tipo GET sin librerías externas o frameworks utilizamos 
         * la función fetch, que viene incluida de forma predeterminada en la API de JavaScript, esto nos devolverá 
         * un objeto de tipo promise, por lo que debe ser llamada como una promesa, de la siguiente forma:*/

        fetch(endpoint).then((res) => {
            /**Dentro del then invocamos al método json() de nuestro
             * objeto res, el cual en sí mismo nos devolverá otra promesa,
             * la cual, sí se cumple, nos permitrá obtener los datos del json*/
            res.json().then((data) => {
                /**Si intentamos asignar data a cities directamente nos dará un error en tiempo de 
                 * ejecución ya que cities está definido como constante, es decir que no se puede reasignar
                 * su valor, por lo que en su lugar usaremos el método push de la clase array
                */

                /*Aquí utilizamos el operador spread (...) para meter cada uno de los
                objetos JSON contenidos en el array data de manera inidividual en el array
                cities, de no usarlo tendríamos un array de arrays*/
                cities.push(...data)
                //console.log(cities)

            }).catch((error) => {
                console.log(error)
            })
        }).catch((err) => {
            console.log(err)
        })

        /**Creamos la función findMatches que recibe dos argumentos, el string a comparar 
         * para buscar coincidencias y el array de ciudades (cities)*/
        function findMatches(matchingWord, cities) {

            //console.log(matchingWord, cities)
            const matches = cities.filter((place) => {

                //console.log(place)
                /**Aquí tenemos que determinar si la ciudad o estado coinciden con la búsqueda realizada, para ello 
                 * creamos una expresión regular con el constructor de la clase RegExp, y le pasamos como primer 
                 * argumento el parámetro matchingWord de nuestra función, y como segundo las flags "gi" que significan
                 * global search (es decir que buscará por toda la cadena), e insensitive (insensible a mayúsculas y minúsculas)
                 * respectivamente*/
                const regex = new RegExp(matchingWord, "gi")
                //Si el estado o la ciudad coinciden con la búsqueda, nos regresará el item respectivo
                const matchings = place.city.match(regex) || place.state.match(regex)

                return matchings
            })

            return matches
        }

        //Creamos otra función para mostrar los valores en pantalla:
        function displayMatches() {

            /**Llamamos a la función findMatches pasandóle como argumentos this.value, es decir, 
             * el valor del objeto sobre el cual sea llamada la función, en este caso nuestro 
             * input search y el array de cities. Guardamos su resultado en matchArray*/
            const matchArray = findMatches(this.value, cities)

            //Mapeamos nuestro matchArray y guardamos el resultado en la variable html
            const html = matchArray.map((place) => {


                /**Creamos un elemento html <li> (un elemento de lista) el cual contendrá dos spans, uno de clase name
                 * y otro de clase population, dentro del primero pondremos una cadena de texto compuesta por el nombre de
                 * la ciudad y el estado y en el segundo la población de dicha ciudad.
                */
                const listOfPlaces = `
                    <li>
                        <span class="name">${place.city}, ${place.state}</span>
                        <span class="population">${place.population}</span>
                    </li>
                `
                return listOfPlaces
            }).join("") //Concatenamos el método join para que nos lo regrese todo en forma de string en vez de array

            //console.log(html)

            //Accedemos a la lista de sugerencias y establecemos el valor de su atributo innerHTML a nuestra variable html
            suggestions.innerHTML = html
        }

        const searchInput = document.getElementById("search") //Obtenemos el input mediante su id
        const suggestions = document.querySelector(".suggestions") //Obtenemos la lista de sugerencias mediante su clase

        /**Añadimos un listener con el evento keyup, es decir se activará cada 
        vez que soltemos una tecla que hayamos presionado*/
        searchInput.addEventListener("keyup", displayMatches)

    </script>
</body>

</html>
