<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Temporizador</title>
    <link href='https://fonts.googleapis.com/css?family=Inconsolata' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>
    <div class="timer">
        <div class="timer__controls">
            <button data-time="20" class="timer__button">20 Segs</button>
            <button data-time="300" class="timer__button">Trabajo 5</button>
            <button data-time="900" class="timer__button">Rápido 15</button>
            <button data-time="1200" class="timer__button">Bocadillo 20</button>
            <button data-time="3600" class="timer__button">Descanso para el almuerzo</button>
            <form name="customForm" id="custom">
                <input type="text" name="minutes" placeholder="Ingrese el tiempo en minutos">
            </form>
        </div>
        <div class="display">
            <h1 class="display__time-left"></h1>
            <p class="display__end-time"></p>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
