<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Whack A Mole!</title>
    <link href='https://fonts.googleapis.com/css?family=Amatic+SC:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="https://fav.farm/🔥" />
</head>

<body>

    <h1>Whack-a-mole! <span class="score">0</span></h1>
    <button class="start">Start!</button>

    <div id="custom-cursor"></div>
    <audio src="golpe-seco.mp3" hidden></audio>

    <div class="game">
        <div class="hole hole1">
            <div class="mole"></div>
        </div>
        <div class="hole hole2">
            <div class="mole"></div>
        </div>
        <div class="hole hole3">
            <div class="mole"></div>
        </div>
        <div class="hole hole4">
            <div class="mole"></div>
        </div>
        <div class="hole hole5">
            <div class="mole"></div>
        </div>
        <div class="hole hole6">
            <div class="mole"></div>
        </div>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.querySelector('.score');
        const moles = document.querySelectorAll('.mole');
        //Seleccionamos el botón de inicio
        const startButton = document.querySelector(".start")
        //Seleccionamos el div que fungirá como cursor:
        const customCursor = document.getElementById("custom-cursor")
        //Seleccionamos el sonido de golpe
        const hitSound = document.querySelector("audio")
        //Esta variable almacenará el último resultado de getRandomHole
        let lastHole

        /**Creamos una variable booleana que detecte si el tiempo  
         * del juego se ha terminado, por defecto estará en false*/

        let timeUp = false

        //Creamos otra variable de tipo number llamada score para el puntaje
        let score

        console.log(holes)
        console.log(moles)
        console.log(scoreBoard)
        console.log(startButton)
        console.log(customCursor)
        console.log(hitSound)

        /**Creamos una función que nos de un número de milisegundos aleatorio entre
         * un límite inferior y uno superior, los cuales recibirá como parámetros*/

        function getRandomTime(min, max) {

            /**Llamamos a Math.round() para obtener un número aleatorio, lo multiplicamos 
             * por la resta de max menos min y a esta le sumamos min otra vez. Redondeamos 
             * el resultado con Math.round y lo guardamos en randomTime*/
            const randomTime = Math.round(Math.random() * (max - min) + min)

            //Retornamos randomTime
            return randomTime
        }

        /**Creamos otra función llamada getRandomHole que seleccionará un elemento
         * al azar de nuestra lista de agujeros, la cual recibirá como parámetro, 
         * y lo retornará
        */
        function getRandomHole(holes) {
            /**Obtenemos un número de 0 a 5 al azar multiplicando Math.random 
             * por la longitud de nuestra lista, y lo redondeamos con Math.floor 
             * para quedarnos sólo con la parte entera*/
            const idx = Math.floor(Math.random() * holes.length)

            //Accedemos a la posición de la lista correspondiente al número que obtuvimos
            const hole = holes[idx]

            /**Si sale el mismo agujero dos veces seguidas, en vez de retornarlo, llamaremos
             * a la función de nuevo hasta que salga uno distinto y retornaremos su resultado
            */

            if (hole === lastHole) {
                console.log("Ese es el mismo agujero de antes")
                return getRandomHole(holes)
            }

            //Asigamos hole a lastHole
            lastHole = hole
            //Retornamos el hoyo
            return hole
        }

        //Creamos una tercera función llamada peep, que controlará la entrada y salida de los topos
        function peep() {

            /**Determinamos el tiempo que permanecerá cada topo fuera 
             * de su agujero mediante la función getRandomTime, el mínimo
             * serán 200 milisegundos y el máximo 1 segundo*/
            const time = getRandomTime(200, 1000)

            //Determinamos el agujero con getRandomHole
            const hole = getRandomHole(holes)

            /**Añadimos al agujero la clase html up, toda la animación de nuestros
             * topos será controlada desde el css mediante esta clase*/
            hole.classList.add("up")

            /**Para que se vuelvan a ocultar una vez transcurrido el tiempo, 
             * le ponemos un timeOut y en la función callback del mismo le
             * retiramos la clase up al respectivo agujero*/

            setTimeout(() => {
                hole.classList.remove("up")
                //Seguimos ejecutando peep cuando timeUp sea igual a false
                !timeUp ? peep() : null
            }, time)
        }

        //Creamos una cuarta función para iniciar el juego:
        function startGame() {
            //Ocultamos el cursor predeterminado
            document.body.style.cursor = "none"
            //Hacemos visible el cursor personalizado
            customCursor.style.display = "block"
            //Reiniciamos el marcador de puntos a 0:
            scoreBoard.textContent = "0"
            //Reiniciamos el puntaje también además del DOM
            score = 0
            //Reiniciamos timeUp a false
            timeUp = false

            //Llamamos a peep
            peep()

            /**Ponemos un temporizador de 30 segundos despúes de los 
             * cuales timeUp será true, es decir que el juego terminará*/
            setTimeout(() => {
                timeUp = true
                alert("¡Se acabó el tiempo!")
                //Hacemos invisible de nuevo el cursor personalizado
                customCursor.style.display = "none"
                //Le removemos el EventListener para no clickear cosas por error
                window.removeEventListener("mousemove", moveCustomCursor)
                //Hacemos visible de nuevo el cursor normal
                document.body.style.cursor = "default"
            }, 30000)
        }

        /**Creamos una última función para detectar cuando se golpee a un topo 
         * y aumentar el marcador de manera acorde. Esta recibirá como parámetro
         * la información del evento.*/

        /**En los objetos JSON que guardan la info de los eventos tenemos un atributo
         * booleano llamado "isTrusted", el cual nos indica si el evento en cuestión fue
         * realmente desencadenado por un usuario (true) o si ha sido simulado mediante un 
         * script (false). Ejecutaremos esta función sólo cuando isTrusted sea true para evitar
         * que el usuario haga trampa usando autoclickers o similares*/

        function bonk(e) {

            if (!!e.isTrusted) {
                //Reproducimos el sonido de golpe
                hitSound.currentTime = 0
                hitSound.play()

                //Añadimos la clase active al martillo para hacerlo rotar
                customCursor.classList.add("active")

                setTimeout(() => customCursor.classList.remove("active"), 200)
                //Aumentamos el puntaje en 10 cada vez
                score += 10
                //Hacemos que el topo baje incluso si aún le queda tiempo
                this.classList.remove("up")

                //Actualizamos el marcador visualmente
                scoreBoard.textContent = score
            }
        }


        /**Creamos una función que maneje nuestro cursor personalizado 
         * y reciba como parámetro la información del evento:*/
        function moveCustomCursor(e) {

            /**Asignamos el valor de clientX y clientY del evento a los atributos
             * top y left de nuestro cursor predeterminado, recordando añadir px
             * al final 
            */
            customCursor.style.left = `${e.clientX}px`
            customCursor.style.top = `${e.clientY}px`
        }

        /**Creamos una función que añada un EventListener a algún elemento,
         * deberemos especificar el elemento, el tipo de evento y la función 
         * que invocará el listener en cuestión
        */
        function addListenerToElement(element, eventType, handler) {
            //Invocamos addEventListener sobre element y le pasamos eventType y handler
            element.addEventListener(eventType, handler)
        }
        //Invocamos startGame al hacer clic en el botón de inicio
        startButton.addEventListener("click", startGame)
        /**De la misma manera invocamos addListenerToElement, le pasamos window como element,
         * mousemove como eventType y moveCustomCursor como handler
        */
        startButton.addEventListener("click", () => addListenerToElement(window, "mousemove", moveCustomCursor))

        //Añadimos a cada topo un listener de tipo click que llamará a bonk mediante un forEach
        moles.forEach((mole) => mole.addEventListener("click", bonk))

    </script>
</body>

</html>
