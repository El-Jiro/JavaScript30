<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sort Without Articles</title>
    <link rel="shortcut icon" href="https://fav.farm/🔥" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/e56f733d59.js" crossorigin="anonymous"></script>
</head>

<body>
    <ul id="bands"></ul>
    <button type="button" id="sort"
        title="Presione para ordenar alfábeticamente la lista sin tomar en cuenta los artículos.">
        Ordenar
        <i class="fa-solid fa-arrow-down-a-z"></i>
    </button>
    <button type="button" id="unsort" title="Presione para desordenar nuevamente la lista.">
        Restaurar
        <i class="fa-solid fa-arrows-rotate"></i>
    </button>

    <script>
        const bands = [
            'The Plot in You',
            'The Devil Wears Prada',
            'Pierce the Veil',
            'Norma Jean',
            'The Bled',
            'Say Anything',
            'The Midway State',
            'We Came as Romans',
            'Counterparts',
            'Oh, Sleeper',
            'A Skylit Drive',
            'Anywhere But Here',
            'An Old Dog'
        ]

        //Añadimos una variable booleana que nos indique si la lista ya está ordenada
        let sorted = false

        //Seleccionamos nuestra lista y la guardamos en una variable:
        const bandsList = document.getElementById("bands")

        bandsList.innerHTML = bands.map((band) => `<li>${band}</li>`).join("")

        console.log(bands)

        //Empezamos mostrando el array desordenado:
        bands
        //Creamos una expresión regular para matchear con los artículos:
        const articleRegex = /^(a |an |the )/i

        //Creamos una función para remover los artículos (A, An, The, etc) del nombre
        function removeArticles(bandName) {
            /**Usamos el método replace para remover los artículos, le pasamos nuestra
             * expresión regular como primer argumento (este el texto que queremos reemplazar)
             * y como segundo argumento (el texto de reemplazo) una cadena vacía. Añadimos un
             * trim al final para eliminar los espacios en blanco que hayan quedado.*/
            const strippedName = bandName.replace(articleRegex, "").trim()

            return strippedName
        }

        //Creamos una nueva función para ordenar las bandas
        function sortBands() {

            //Si ya está ordenada sale de la función sin hacer nada
            if (!!sorted) {
                return
            }

            /**Usamos nuestra función removeArticles para ayudarnos a ordenar las bandas 
             * sin tomar en cuenta los artículos, simplemente le pasamos un callback con 
             * dos parámetros: a y b y comprobamos cual es mayor en el orden alfábetico 
             * despúes de haber sido pasados por nuestra función, si a es mayor que b 
             * retornamos 1, de lo contrario retornamos -1*/
            const sortedBands = [...bands].sort((a, b) => removeArticles(a) > removeArticles(b) ? 1 : -1)
            console.log(sortedBands)

            console.log(bandsList)

            /**Ahora mapeamos sortedBands para poner cada elemento en una etiqueta <li></li> 
             * y le añadimos un join("") al final para que nos lo retorne todo como un solo string
             * en vez de un array de strings. Por último lo ponemos dentro de nuestra lista asignándolo
             * a su atributo innerHTML
            */
            bandsList.innerHTML = sortedBands.map((band) => `<li>${band}</li>`).join("")
            sorted = true
        }

        function unsort() {
            if (!sorted) {
                return
            }
            bandsList.innerHTML = bands.map((band) => `<li>${band}</li>`).join("")
            sorted = false
        }

        //Seleccionamos el botón mediante su id y lo guardamos en una variable
        const sortButton = document.getElementById("sort")
        const unsortButton = document.getElementById("unsort")

        //Añadimos un listener de tipo click al botón e invocamos nuestra función sortBands
        sortButton.addEventListener("click", sortBands)
        unsortButton.addEventListener("click", unsort)
    </script>
</body>

</html>
